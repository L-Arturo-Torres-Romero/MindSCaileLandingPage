    title: "Timeline"
    text: "Discover our story"
    section: timeline
    # left is the default
    #start_align: "left"
    events:
      - title: "Building Experience"
        year: "2007-2023"
        desc: "Over the years, we gain experience across different industries, developing technical expertise and learning from real-world challenges, projects, and technologies."
        image: assets/img/timeline/1.jpg
        alt:
      - title: "An Agency is Born"
        year: "March 2025"
        desc: "Our conversations turn into an idea: bringing together our experience and knowledge to explore how emerging technologies can create new opportunities for organizations."
        image: assets/img/timeline/2.jpg
        alt:
      - title: "Looking for Challenges"
        year: "2025 - Present"
        desc: "With MindScAIle taking shape, we begin looking for opportunities where our experience and emerging technologies can make a real difference."
        image: assets/img/timeline/3.jpg
        alt: image alt text
        # you can enforce the alignment
        align: right
    end: "Be Part <br> of Our <br> Story!"

  about:
    title: "About Us"
    text: "Turning engineering challenges into intelligent solutions"
    body: |
      MindScAile is a technology consulting initiative built on more than two decades of experience in software engineering, automotive development, factory automation, and systems architecture. We combine advanced engineering knowledge, artificial intelligence, and a practical understanding of industrial processes to help organizations develop safer, more efficient, and scalable solutions.

      Our expertise covers the complete development lifecycle, from requirements analysis and project planning to software architecture, testing, validation, and implementation. We work with recognized methodologies and standards such as ASPICE, ISO 26262, ISTQB, PMP, and Scrum.

      At MindScAile, we begin by understanding each organization's processes and challenges. We then identify opportunities for improvement and propose intelligent tools tailored to its operational and business objectives.
    highlights:
      - title: "Automotive Engineering"
        desc: "Safety-focused software development, testing, validation, and systems architecture."
        icon: "fas fa-car"
      - title: "Factory Automation"
        desc: "Integration of industrial software, PLCs, robots, instruments, and production equipment."
        icon: "fas fa-industry"
      - title: "AI-Driven Solutions"
        desc: "Intelligent tools designed to optimize processes, support decisions, and reduce operational risks."
        icon: "fas fa-brain"
    process_title: "From analysis to implementation"
    process:
      - number: "01"
        title: "Understand the challenge"
      - number: "02"
        title: "Design the right solution"
      - number: "03"
        title: "Transform the process"
    section: about

  clients:
    section: clients
    max-height: 100px
    horizontal-scrolling: "" #"yes/no"
    list:
      - title: "envato"
        url: https://github.com/raviriley/agency-jekyll-theme
        logo: assets/img/clients/envato.jpg
      - title: "designmodo"
